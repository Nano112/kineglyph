<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">Kineglyph</title>
  <desc id="desc">A minimal cream cover with the Kineglyph wordmark and a line moving through geometric forms.</desc>

  <rect width="1400" height="480" fill="#efede6"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="62" fill="#676a64" font-size="12" font-weight="650" letter-spacing="2">KINEGLYPH / 001</text>
    <text x="1328" y="62" fill="#676a64" font-size="12" text-anchor="end" letter-spacing="1.2">LIVE SVG · PNG · GIF</text>

    <text x="66" y="222" fill="#171916" font-size="104" font-weight="720" letter-spacing="-7">Kineglyph</text>
    <text x="72" y="276" fill="#171916" font-size="20" font-weight="550">Technical illustrations with a pulse.</text>
    <text x="72" y="316" fill="#676a64" font-size="14">Typed scenes. Deterministic frames.</text>

    <path d="M72 390H1328" stroke="#c8c6be"/>
    <text x="72" y="427" fill="#676a64" font-size="11" letter-spacing="1.4">SCENE</text>
    <text x="204" y="427" fill="#676a64" font-size="11" letter-spacing="1.4">SIGNAL</text>
    <text x="336" y="427" fill="#676a64" font-size="11" letter-spacing="1.4">FRAME</text>

    <g transform="translate(750 96)">
      <path id="motion-path" d="M20 210C104 64 196 60 272 164S438 280 574 94" fill="none" stroke="#171916" stroke-width="1.5"/>
      <path d="M20 210C104 64 196 60 272 164S438 280 574 94" fill="none" stroke="#00a98f" stroke-width="7" opacity=".08"/>

      <circle cx="20" cy="210" r="8" fill="#efede6" stroke="#171916" stroke-width="2"/>
      <circle cx="188" cy="94" r="35" fill="none" stroke="#171916" stroke-width="1.5"/>
      <circle cx="188" cy="94" r="23" fill="none" stroke="#00a98f" stroke-width="1.5" stroke-dasharray="3 5"/>
      <rect x="300" y="166" width="66" height="66" fill="none" stroke="#171916" stroke-width="1.5" transform="rotate(12 333 199)"/>
      <path d="M456 214L500 138L544 214Z" fill="none" stroke="#171916" stroke-width="1.5"/>
      <circle cx="574" cy="94" r="8" fill="#00a98f"/>

      <g fill="#676a64" font-size="10" letter-spacing="1">
        <text x="-2" y="240">SOURCE</text>
        <text x="159" y="46">RESOLVE</text>
        <text x="301" y="267">BIND</text>
        <text x="450" y="246">SEEK</text>
        <text x="546" y="64">RENDER</text>
      </g>

      <circle cx="20" cy="210" r="6" fill="#00a98f">
        <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" path="M0 0C84 -146 176 -150 252 -46S418 70 554 -116"/>
      </circle>
