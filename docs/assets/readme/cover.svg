<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Kineglyph</title>
  <desc id="desc">A dark technical canvas showing the Kineglyph name beside a plotted signal, a state path, and diagram nodes.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#252b35" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#333a47" opacity=".62"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd1bc" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#7386d5" stop-opacity=".035"/>
      <stop offset="1" stop-color="#0e1014" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#5fd1bc"/>
    </marker>
  </defs>

  <rect width="1200" height="480" rx="18" fill="#0e1014"/>
  <rect x="1" y="1" width="1198" height="478" rx="17" fill="none" stroke="#333a47"/>
  <rect width="1200" height="480" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="480" rx="18" fill="url(#wash)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(58 52)">
      <g fill="#8a93a3" font-size="11" font-weight="600" letter-spacing="1.6">
        <text x="0" y="0">SCENE  /  SIGNAL  /  FRAME</text>
      </g>

      <text x="-4" y="94" fill="#e4e7ec" font-size="68" font-weight="760" letter-spacing="-4">KINE</text>
      <text x="-4" y="158" fill="#5fd1bc" font-size="68" font-weight="760" letter-spacing="-4">GLYPH</text>
      <path d="M0 184H306" stroke="#333a47"/>
      <text x="0" y="222" fill="#e4e7ec" font-size="18" font-weight="600">Technical illustrations</text>
      <text x="0" y="250" fill="#e4e7ec" font-size="18" font-weight="600">with a pulse.</text>
      <text x="0" y="292" fill="#8a93a3" font-size="13">typed scenes · deterministic frames</text>

      <g transform="translate(0 326)">
        <rect width="87" height="34" rx="4" fill="#161a21" stroke="#333a47"/>
        <rect x="100" width="104" height="34" rx="4" fill="#161a21" stroke="#333a47"/>
        <rect x="217" width="47" height="34" rx="4" fill="#161a21" stroke="#333a47"/>
        <rect x="277" width="47" height="34" rx="4" fill="#161a21" stroke="#333a47"/>
        <g fill="#8a93a3" font-size="9" font-weight="600" letter-spacing=".5" text-anchor="middle">
          <text x="43.5" y="21">LIVE SVG</text>
          <text x="152" y="21">STATIC SVG</text>
          <text x="240.5" y="21">PNG</text>
          <text x="300.5" y="21">GIF</text>
        </g>
      </g>
    </g>

    <g transform="translate(442 44)">
      <rect width="700" height="392" rx="10" fill="#12151b" stroke="#333a47"/>
      <path d="M0 42H700" stroke="#252b35"/>
      <circle cx="22" cy="21" r="4" fill="#5fd1bc"/>
      <text x="38" y="25" fill="#8a93a3" font-size="11">figure://signal-map</text>
      <text x="619" y="25" fill="#8a93a3" font-size="10">t = 720</text>

      <g transform="translate(28 72)">
        <rect width="194" height="118" rx="7" fill="#161a21" stroke="#333a47"/>
        <text x="16" y="23" fill="#8a93a3" font-size="9" font-weight="700" letter-spacing="1">INPUT</text>
        <text x="16" y="48" fill="#e4e7ec" font-size="14" font-weight="650">typed rows</text>
        <g transform="translate(16 65)">
          <rect width="162" height="34" rx="3" fill="#0e1014"/>
          <path d="M0 11H162M0 22H162M40 0V34M81 0V34M121 0V34" stroke="#252b35"/>
          <rect x="42" y="13" width="37" height="8" fill="#7386d5" opacity=".7"/>
          <rect x="83" y="2" width="36" height="8" fill="#5fd1bc" opacity=".9"/>
          <rect x="123" y="24" width="37" height="8" fill="#dc8b5f" opacity=".75"/>
        </g>

        <path d="M202 59H255" fill="none" stroke="#5fd1bc" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
        <circle cx="230" cy="59" r="4" fill="#5fd1bc" filter="url(#glow)"/>

        <rect x="266" width="350" height="204" rx="7" fill="#161a21" stroke="#333a47"/>
        <text x="282" y="23" fill="#8a93a3" font-size="9" font-weight="700" letter-spacing="1">RESOLVED SCENE</text>
        <text x="582" y="23" fill="#5fd1bc" font-size="9" text-anchor="end">wide</text>
        <path d="M300 164H590M300 43V164" fill="none" stroke="#333a47"/>
        <path d="M300 132L358 118L416 126L474 76L532 91L590 53" fill="none" stroke="#5fd1bc" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M300 132L358 118L416 126L474 76L532 91L590 53L590 164H300Z" fill="#5fd1bc" opacity=".08"/>
        <g fill="#5fd1bc" stroke="#12151b" stroke-width="3">
          <circle cx="300" cy="132" r="5"/><circle cx="358" cy="118" r="5"/><circle cx="416" cy="126" r="5"/>
          <circle cx="474" cy="76" r="5"/><circle cx="532" cy="91" r="5"/><circle cx="590" cy="53" r="5"/>
        </g>
        <path d="M474 43V164" stroke="#7386d5" stroke-dasharray="3 4" opacity=".8"/>
        <rect x="493" y="52" width="77" height="24" rx="3" fill="#1b2029" stroke="#7386d5"/>
        <text x="531.5" y="68" fill="#e4e7ec" font-size="9" text-anchor="middle">threshold</text>

        <g transform="translate(0 220)">
          <text x="0" y="11" fill="#8a93a3" font-size="9" font-weight="700" letter-spacing="1">STATE</text>
          <rect x="0" y="28" width="132" height="55" rx="5" fill="#161a21" stroke="#5fd1bc"/>
          <rect x="232" y="28" width="132" height="55" rx="5" fill="#161a21" stroke="#333a47"/>
          <rect x="464" y="28" width="152" height="55" rx="5" fill="#161a21" stroke="#333a47"/>
          <text x="66" y="61" fill="#e4e7ec" font-size="12" text-anchor="middle">source</text>
          <text x="298" y="61" fill="#e4e7ec" font-size="12" text-anchor="middle">resolve</text>
          <text x="540" y="61" fill="#e4e7ec" font-size="12" text-anchor="middle">render</text>
          <path d="M132 55H224M364 55H456" fill="none" stroke="#5fd1bc" stroke-width="1.5" marker-end="url(#arrow)"/>
          <circle cx="181" cy="55" r="4" fill="#5fd1bc" filter="url(#glow)"/>
          <text x="181" y="41" fill="#8a93a3" font-size="8" text-anchor="middle">compile</text>
          <text x="411" y="41" fill="#8a93a3" font-size="8" text-anchor="middle">frame</text>
        </g>
      </g>
    </g>
  </g>
</svg>
