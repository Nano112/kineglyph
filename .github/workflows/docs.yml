# Kineglyph's documentation, built with the pinned Pagina renderer and deployed to GitHub Pages.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/operational-dashboard/**"
      - "packages/**"
      - "tools/build-docs-site.sh"
      - ".github/workflows/docs.yml"
      - ".github/pagina-ref"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "docs/**"
      - "examples/operational-dashboard/**"
      - "packages/**"
      - "tools/build-docs-site.sh"
      - ".github/workflows/docs.yml"
      - ".github/pagina-ref"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  KINEGLYPH_SITE_URL: https://nano112.github.io/kineglyph/

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out Kineglyph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kineglyph

      - name: Read the pinned Pagina ref
        run: echo "PAGINA_REF=$(cat kineglyph/.github/pagina-ref)" >> "$GITHUB_ENV"

      - name: Check out Pagina
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nano112/pagina
          ref: ${{ env.PAGINA_REF }}
          path: pagina

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            kineglyph/package-lock.json
            pagina/package-lock.json

      - name: Install and build Kineglyph
        working-directory: kineglyph
        run: |
          npm ci --no-audit --no-fund
          npm run docs:check
          npm run bootstrap

      - name: Install and build Pagina
        working-directory: pagina
        run: |
          npm ci --no-audit --no-fund
          mkdir -p node_modules/@kineglyph
          for package in core svg anime plot scenes web export react; do
            rm -rf "node_modules/@kineglyph/$package"
            ln -s "$GITHUB_WORKSPACE/kineglyph/packages/$package" "node_modules/@kineglyph/$package"
          done
          npm run build

      - name: Build the documentation site
        working-directory: kineglyph
        run: tools/build-docs-site.sh "$GITHUB_WORKSPACE/site"

      - name: Upload the portable article
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kineglyph-docs-bundle
          path: ${{ github.workspace }}/site.pgz
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ github.workspace }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
